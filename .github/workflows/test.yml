name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = minimum declared in pyproject.toml; 3.14 = the Dockerfile's runtime.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      # uv.lock es la fuente única de versiones; --locked falla si no corresponde a pyproject.toml.
      - name: Install dependencies (uv.lock)
        run: uv sync --locked --extra dev --no-editable --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run --no-sync ruff check src/ tests/
        env:
          PYTHONPATH: .

      - name: Typecheck (mypy)
        run: uv run --no-sync mypy

      # La unidad de systemd que genera `jota-gw install`, verificada por systemd de verdad
      # (comprueba la sintaxis y que ExecStart exista: se usa el jota-gw del .venv del runner).
      - name: Unidad de systemd (systemd-analyze verify)
        run: |
          mkdir -p "$RUNNER_TEMP/unit"
          uv run --no-sync python -c "
          import sys
          from pathlib import Path
          from jota_gateway.cli.service import render_unit
          exe = Path('.venv/bin/jota-gw').resolve()
          Path(sys.argv[1], 'jota-gateway.service').write_text(render_unit(exe, Path.home() / '.jota-gateway'))
          " "$RUNNER_TEMP/unit"
          cat "$RUNNER_TEMP/unit/jota-gateway.service"
          systemd-analyze --user verify "$RUNNER_TEMP/unit/jota-gateway.service"

      - name: Unit tests
        run: uv run --no-sync pytest tests/unit/ -v --cov=jota_gateway --cov-report=
        env:
          PYTHONPATH: .

      - name: Contract tests (proveedores de voz)
        run: uv run --no-sync pytest tests/contract/ -v --cov=jota_gateway --cov-append --cov-report=
        env:
          PYTHONPATH: .

      - name: Integration tests
        run: uv run --no-sync pytest tests/integration/ -v --cov=jota_gateway --cov-append --cov-report=term-missing
        env:
          PYTHONPATH: .

  # Aggregate gate: the "production" ruleset requires a check named exactly
  # "test". The matrix above reports "tests (3.12)"/"tests (3.14)", so this
  # job keeps the required name and fails unless every matrix leg and the
  # Docker build succeeded. Add new required jobs to `needs`, not to the ruleset.
  test:
    runs-on: ubuntu-latest
    needs: [tests, docker-build, package, service-smoke]
    if: always()
    steps:
      - name: Require all jobs to succeed
        run: |
          echo "tests=${{ needs.tests.result }} docker-build=${{ needs.docker-build.result }} package=${{ needs.package.result }} service-smoke=${{ needs.service-smoke.result }}"
          [ "${{ needs.tests.result }}" = "success" ] && [ "${{ needs.docker-build.result }}" = "success" ] && [ "${{ needs.package.result }}" = "success" ] && [ "${{ needs.service-smoke.result }}" = "success" ]

  # La instalación nativa (M14c): el wheel lleva Alembic y sus migraciones, y el programa
  # instalado funciona desde cualquier directorio, sin el checkout.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      # El venv limpio de abajo instala el wheel sin lock, como un usuario de pip.
      - name: Build the wheel and check it carries Alembic
        run: |
          uv build --wheel -o dist
          unzip -l dist/*.whl > contents.txt
          for f in "jota_gateway/alembic.ini" "jota_gateway/migrations/env.py" \
                   "jota_gateway/migrations/script.py.mako" "jota_gateway/migrations/versions/[0-9a-f]\{12\}_.*\.py"; do
            grep -q "$f" contents.txt || { echo "Falta $f en el wheel"; exit 1; }
          done

      - name: Clean venv, run from /tmp - no DB means no start, init then serve
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          export PATH=/tmp/venv/bin:$PATH
          cd /tmp
          empty=$(mktemp -d)
          rc=0; JOTA_GATEWAY_HOME=$empty timeout 60 jota-gw serve || rc=$?
          echo "serve sin BD: rc=$rc"
          [ "$rc" = 3 ]
          [ ! -e "$empty/data" ]  # ni BD, ni data/, ni candado
          base=$(mktemp -d)/gw
          JOTA_GATEWAY_HOME=$base jota-gw init
          JOTA_GATEWAY_HOME=$base jota-gw serve & pid=$!
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8004/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8004/healthz
          kill $pid
          python -c "import sqlite3, sys; print(sqlite3.connect(sys.argv[1]).execute('SELECT version_num FROM alembic_version').fetchone()[0])" "$base/data/gateway.db"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: jota-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke - starts as non-root and HEALTHCHECK turns healthy
        run: |
          docker run -d --name gw -e ADMIN_TOKEN=ci -e OPENCLAW_TOKEN=ci jota-gateway:ci
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' gw)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          echo "health=$status"
          [ "$status" = "healthy" ] || { docker logs gw; exit 1; }
          uid=$(docker exec gw id -u)
          echo "uid=$uid"
          [ "$uid" != "0" ]
          docker rm -f gw

      - name: Smoke - writes gateway.db to a bind mount owned by an arbitrary host UID
        run: |
          mkdir data
          docker run -d --name gw2 --user "$(id -u):$(id -g)" -v "$PWD/data:/app/data" \
            -e ADMIN_TOKEN=ci -e OPENCLAW_TOKEN=ci jota-gateway:ci
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' gw2)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          echo "health=$status"
          [ "$status" = "healthy" ] || { docker logs gw2; exit 1; }
          ls -l data/gateway.db
          docker rm -f gw2

  # M14d: la instalación nativa como servicio de usuario de systemd, de punta a punta en el
  # runner de Ubuntu: init, install, healthz, reinicio de la sesión de usuario (el «reboot»),
  # logs, config set y uninstall; después «Docker → nativo» (migrate) y «Actualizar» sobre una
  # base aparte. Todas las esperas tienen tiempo límite.
  service-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # journalctl sin TTY ya no pagina; esto lo garantiza para `jota-gw logs` (execvp).
      SYSTEMD_PAGER: ""
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      # Como la instalación oficial: no editable y fuera del checkout (pick_exe rechaza lo contrario).
      - name: Instalar jota-gw como uv tool
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o /tmp/c.txt
          uv tool install . -c /tmp/c.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          which jota-gw
          [ "$(which jota-gw)" = "$HOME/.local/bin/jota-gw" ]
          jota-gw version || true

      - name: Preparar systemd de usuario (linger y bus)
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          # Funciones compartidas por los pasos siguientes (cada paso es un shell nuevo).
          cat > "$RUNNER_TEMP/h.sh" <<'EOF'
          wait_bus() {  # hasta 60 s: bus de usuario y systemd en running o degraded
            for i in $(seq 1 60); do
              state=$(systemctl --user is-system-running 2>/dev/null || true)
              if [ -S "$XDG_RUNTIME_DIR/bus" ] && { [ "$state" = running ] || [ "$state" = degraded ]; }; then
                echo "systemd de usuario: $state"; return 0
              fi
              sleep 1
            done
            echo "systemd de usuario no está listo (state=$state)"; return 1
          }
          wait_health() {  # hasta $1 s (60 por defecto)
            for i in $(seq 1 "${1:-60}"); do
              curl -fs --max-time 2 http://127.0.0.1:8004/healthz >/dev/null && return 0
              sleep 1
            done
            echo "/healthz no responde"; return 1
          }
          EOF
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          . "$RUNNER_TEMP/h.sh"
          wait_bus

      # init no necesita tokens: crea config.env con un ADMIN_TOKEN aleatorio y la BD.
      - name: jota-gw init
        run: |
          jota-gw init
          ls -l ~/.jota-gateway ~/.jota-gateway/data

      - name: jota-gw install y healthz
        run: |
          . "$RUNNER_TEMP/h.sh"
          jota-gw --yes install
          curl -fs --max-time 2 http://127.0.0.1:8004/healthz; echo
          [ "$(systemctl --user is-enabled jota-gateway.service)" = enabled ]

      # Reinicia la sesión de usuario: para el servicio y lo vuelve a arrancar por default.target + linger.
      # Límite: no es un reboot real del kernel; lo más cercano posible en un runner.
      - name: Reboot simulado (user@UID.service)
        run: |
          . "$RUNNER_TEMP/h.sh"
          [ "$(loginctl show-user "$USER" -p Linger --value)" = yes ]
          old_inv=$(systemctl --user show -p InvocationID --value jota-gateway.service)
          old_pid=$(systemctl --user show -p MainPID --value jota-gateway.service)
          echo "antes: InvocationID=$old_inv MainPID=$old_pid"
          [ -n "$old_inv" ]
          [ "$old_pid" -gt 0 ]
          sudo systemctl restart "user@$(id -u).service"
          wait_bus
          wait_health 60
          new_inv=$(systemctl --user show -p InvocationID --value jota-gateway.service)
          echo "después: InvocationID=$new_inv"
          [ -n "$new_inv" ]
          [ "$new_inv" != "$old_inv" ]
          if kill -0 "$old_pid" 2>/dev/null; then echo "el PID viejo $old_pid sigue vivo"; exit 1; fi
          [ "$(systemctl --user is-active jota-gateway.service)" = active ]

      - name: jota-gw logs
        run: |
          jota-gw logs -n 20 --level WARNING  # puede no imprimir nada
          jota-gw logs -n 5 > "$RUNNER_TEMP/logs.txt"
          cat "$RUNNER_TEMP/logs.txt"
          [ -s "$RUNNER_TEMP/logs.txt" ]

      - name: config set LOG_FORMAT json (reinicia el servicio)
        run: |
          . "$RUNNER_TEMP/h.sh"
          old_inv=$(systemctl --user show -p InvocationID --value jota-gateway.service)
          jota-gw --yes config set LOG_FORMAT json
          wait_health 60
          new_inv=$(systemctl --user show -p InvocationID --value jota-gateway.service)
          [ -n "$old_inv" ]
          [ -n "$new_inv" ]
          [ "$new_inv" != "$old_inv" ]  # hubo restart
          jota-gw logs -n 20 > "$RUNNER_TEMP/logs.txt"
          cat "$RUNNER_TEMP/logs.txt"
          python3 -c "
          import json, sys
          for line in open(sys.argv[1]):
              try:
                  if isinstance(json.loads(line), dict):
                      sys.exit(0)
              except ValueError:
                  pass
          sys.exit('ninguna línea de log es JSON')
          " "$RUNNER_TEMP/logs.txt"

      - name: jota-gw uninstall (los datos se quedan)
        run: |
          jota-gw --yes uninstall
          [ ! -e ~/.config/systemd/user/jota-gateway.service ]
          [ -f ~/.jota-gateway/config.env ]
          [ -f ~/.jota-gateway/data/gateway.db ]
          if curl -fs --max-time 3 http://127.0.0.1:8004/healthz; then echo "el servicio sigue respondiendo"; exit 1; fi

      # Docker falso: el directorio que dejaría compose (.env + data/gateway.db). La BD sale de
      # `init` en otra base; el cliente se crea con un gateway real sobre esa base, antes de
      # instalar nada nativo (serve usa el 8004 fijo y el servicio nativo ya está desinstalado).
      - name: Docker falso con un cliente (BD en el head del paquete)
        run: |
          . "$RUNNER_TEMP/h.sh"
          D="$RUNNER_TEMP/docker-fake"
          echo "DOCKER_DIR=$D" >> "$GITHUB_ENV"
          echo "NATIVE_HOME=$RUNNER_TEMP/native" >> "$GITHUB_ENV"
          jota-gw --home "$D" init
          jota-gw --home "$D" serve > "$RUNNER_TEMP/docker-serve.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          wait_health 60
          jota-gw --home "$D" --json clients add --name smoke-docker > /dev/null  # sin mostrar la clave
          jota-gw --home "$D" --json clients list > "$RUNNER_TEMP/src-clients.json"
          grep -q smoke-docker "$RUNNER_TEMP/src-clients.json"
          kill "$pid"
          wait "$pid" || true  # SIGTERM: salida 0 o 143
          if curl -fs --max-time 2 http://127.0.0.1:8004/healthz; then echo "el gateway de origen sigue vivo"; exit 1; fi
          # .env a mano, como el de compose: comentario, export, DATABASE_URL relativa y UID/GID.
          token=$(sed -n 's/^ADMIN_TOKEN=//p' "$D/config.env")
          [ -n "$token" ]
          {
            echo "# .env de compose (falso)"
            echo "ADMIN_TOKEN=$token"
            echo "GATEWAY_UID=$(id -u)"
            echo "GATEWAY_GID=$(id -g)"
            echo "DATABASE_URL=sqlite:///data/gateway.db"
            echo "export TRUST_LOOPBACK=true"
          } > "$D/.env"
          rm "$D/config.env"
          ls -l "$D" "$D/data"
          sha256sum "$D/.env" "$D/data/gateway.db" > "$RUNNER_TEMP/src.sha"

      # El candado lo toma un `flock -x` (el contenedor en marcha): migrate debe negarse y no
      # dejar nada en la base nativa.
      - name: migrate se niega con el candado de Docker tomado
        run: |
          lock="$DOCKER_DIR/data/gateway.lock"
          [ -e "$lock" ]
          flock --no-fork -x "$lock" sleep 300 &
          holder=$!
          trap 'kill "$holder" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do  # espera a que el candado esté tomado de verdad
            if flock -n -s "$lock" true; then sleep 0.2; else break; fi
          done
          if flock -n -s "$lock" true; then echo "el candado no se ha tomado"; exit 1; fi
          rc=0
          jota-gw --home "$NATIVE_HOME" migrate --from-docker "$DOCKER_DIR" > "$RUNNER_TEMP/mig.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/mig.txt"
          [ "$rc" -ne 0 ]
          grep -q "sigue en marcha" "$RUNNER_TEMP/mig.txt"  # falla por el candado y no por otra cosa
          [ ! -e "$NATIVE_HOME/config.env" ]
          [ ! -e "$NATIVE_HOME/data/gateway.db" ]
          kill "$holder"
          wait "$holder" || true

      - name: jota-gw migrate --from-docker
        run: |
          jota-gw --home "$NATIVE_HOME" migrate --from-docker "$DOCKER_DIR"
          ls -l "$NATIVE_HOME" "$NATIVE_HOME/data"
          [ "$(stat -c %a "$NATIVE_HOME/config.env")" = 600 ]
          [ "$(stat -c %a "$NATIVE_HOME/data/gateway.db")" = 600 ]
          if grep -Eiq '^[[:space:]]*(export[[:space:]]+)?(DATABASE_URL|GATEWAY_UID|GATEWAY_GID)[[:space:]]*=' "$NATIVE_HOME/config.env"; then
            echo "config.env conserva variables de compose"; exit 1
          fi
          grep -qx 'LOG_FORMAT=json' "$NATIVE_HOME/config.env"
          grep -q '^ADMIN_TOKEN=' "$NATIVE_HOME/config.env"
          grep -q '^# \.env de compose' "$NATIVE_HOME/config.env"  # el resto del fichero, tal cual
          grep -q '^export TRUST_LOOPBACK=true' "$NATIVE_HOME/config.env"
          sha256sum -c "$RUNNER_TEMP/src.sha"  # el origen, intacto

      - name: install nativo tras migrate y el cliente sigue
        run: |
          . "$RUNNER_TEMP/h.sh"
          jota-gw --home "$NATIVE_HOME" --yes install
          wait_health 60
          curl -fs --max-time 2 http://127.0.0.1:8004/healthz; echo
          [ "$(systemctl --user is-active jota-gateway.service)" = active ]
          # El token sale del config.env migrado: si no se hubiera copiado, /admin daría 401.
          jota-gw --home "$NATIVE_HOME" --json clients list > "$RUNNER_TEMP/clients.json"
          python3 -c "
          import json, sys
          rows = json.load(open(sys.argv[1]))
          sys.exit(0 if any(r['name'] == 'smoke-docker' for r in rows) else 'el cliente migrado no está')
          " "$RUNNER_TEMP/clients.json"

      # README «Actualizar»: reinstalar el tool sobre el anterior (misma rama: se prueba el
      # procedimiento) y reiniciar. Las migraciones se aplican solas al arrancar.
      - name: Actualizar (uv tool install --reinstall y restart)
        run: |
          . "$RUNNER_TEMP/h.sh"
          old_inv=$(systemctl --user show -p InvocationID --value jota-gateway.service)
          [ -n "$old_inv" ]
          uv tool install --reinstall . -c /tmp/c.txt
          [ "$(which jota-gw)" = "$HOME/.local/bin/jota-gw" ]
          jota-gw --home "$NATIVE_HOME" --yes restart
          wait_health 60
          new_inv=$(systemctl --user show -p InvocationID --value jota-gateway.service)
          [ -n "$new_inv" ]
          [ "$new_inv" != "$old_inv" ]  # hubo restart
          [ "$(systemctl --user is-active jota-gateway.service)" = active ]
          jota-gw --home "$NATIVE_HOME" --json clients list > "$RUNNER_TEMP/clients.json"
          grep -q smoke-docker "$RUNNER_TEMP/clients.json"  # los datos sobreviven a la actualización

      - name: uninstall final (los datos migrados se quedan)
        run: |
          jota-gw --home "$NATIVE_HOME" --yes uninstall
          [ ! -e ~/.config/systemd/user/jota-gateway.service ]
          [ -f "$NATIVE_HOME/config.env" ]
          [ -f "$NATIVE_HOME/data/gateway.db" ]
          if curl -fs --max-time 3 http://127.0.0.1:8004/healthz; then echo "el servicio sigue respondiendo"; exit 1; fi

      - name: Diagnóstico del servicio
        if: failure()
        run: |
          journalctl --user -u jota-gateway.service -n 200 --no-pager || true
          systemctl --user status jota-gateway.service --no-pager || true
          loginctl show-user "$USER" || true
          systemctl --user show -p InvocationID,MainPID,ActiveEnterTimestamp jota-gateway.service || true
