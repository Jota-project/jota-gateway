name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = minimum declared in pyproject.toml; 3.14 = the Dockerfile's runtime.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install .[dev]

      - name: Lint (ruff)
        run: ruff check src/ tests/
        env:
          PYTHONPATH: .

      - name: Typecheck (mypy)
        run: mypy

      - name: Unit tests
        run: pytest tests/unit/ -v --cov=src --cov-report=
        env:
          PYTHONPATH: .

      - name: Integration tests
        run: pytest tests/integration/ -v --cov=src --cov-append --cov-report=term-missing
        env:
          PYTHONPATH: .

  # Aggregate gate: the "production" ruleset requires a check named exactly
  # "test". The matrix above reports "tests (3.12)"/"tests (3.14)", so this
  # job keeps the required name and fails unless every matrix leg and the
  # Docker build succeeded. Add new required jobs to `needs`, not to the ruleset.
  test:
    runs-on: ubuntu-latest
    needs: [tests, docker-build]
    if: always()
    steps:
      - name: Require all jobs to succeed
        run: |
          echo "tests=${{ needs.tests.result }} docker-build=${{ needs.docker-build.result }}"
          [ "${{ needs.tests.result }}" = "success" ] && [ "${{ needs.docker-build.result }}" = "success" ]

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: jota-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke - starts as non-root and HEALTHCHECK turns healthy
        run: |
          docker run -d --name gw -e ADMIN_TOKEN=ci -e OPENCLAW_TOKEN=ci jota-gateway:ci
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' gw)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          echo "health=$status"
          [ "$status" = "healthy" ] || { docker logs gw; exit 1; }
          uid=$(docker exec gw id -u)
          echo "uid=$uid"
          [ "$uid" != "0" ]
          docker rm -f gw

      - name: Smoke - writes gateway.db to a bind mount owned by an arbitrary host UID
        run: |
          mkdir data
          docker run -d --name gw2 --user "$(id -u):$(id -g)" -v "$PWD/data:/app/data" \
            -e ADMIN_TOKEN=ci -e OPENCLAW_TOKEN=ci jota-gateway:ci
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' gw2)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          echo "health=$status"
          [ "$status" = "healthy" ] || { docker logs gw2; exit 1; }
          ls -l data/gateway.db
          docker rm -f gw2
