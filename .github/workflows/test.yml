name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = minimum declared in pyproject.toml; 3.14 = the Dockerfile's runtime.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      # uv.lock es la fuente única de versiones; --locked falla si no corresponde a pyproject.toml.
      - name: Install dependencies (uv.lock)
        run: uv sync --locked --extra dev --no-editable --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run --no-sync ruff check src/ tests/
        env:
          PYTHONPATH: .

      - name: Typecheck (mypy)
        run: uv run --no-sync mypy

      # La unidad de systemd que genera `fogar-gw install`, verificada por systemd de verdad
      # (comprueba la sintaxis y que ExecStart exista: se usa el fogar-gw del .venv del runner).
      - name: Unidad de systemd (systemd-analyze verify)
        run: |
          mkdir -p "$RUNNER_TEMP/unit"
          uv run --no-sync python -c "
          import sys
          from pathlib import Path
          from fogar_gateway.cli.service import render_unit
          exe = Path('.venv/bin/fogar-gw').resolve()
          Path(sys.argv[1], 'fogar-gateway.service').write_text(render_unit(exe, Path.home() / '.fogar-gateway'))
          " "$RUNNER_TEMP/unit"
          cat "$RUNNER_TEMP/unit/fogar-gateway.service"
          systemd-analyze --user verify "$RUNNER_TEMP/unit/fogar-gateway.service"

      - name: Unit tests
        run: uv run --no-sync pytest tests/unit/ -v --cov=fogar_gateway --cov-report=
        env:
          PYTHONPATH: .

      - name: Contract tests (proveedores de voz)
        run: uv run --no-sync pytest tests/contract/ -v --cov=fogar_gateway --cov-append --cov-report=
        env:
          PYTHONPATH: .

      - name: Integration tests
        run: uv run --no-sync pytest tests/integration/ -v --cov=fogar_gateway --cov-append --cov-report=term-missing
        env:
          PYTHONPATH: .

  # Aggregate gate: the "production" ruleset requires a check named exactly
  # "test". The matrix above reports "tests (3.12)"/"tests (3.14)", so this
  # job keeps the required name and fails unless every matrix leg and the
  # Docker build succeeded. Add new required jobs to `needs`, not to the ruleset.
  test:
    runs-on: ubuntu-latest
    needs: [tests, web, docker-build, package, service-smoke, installer-smoke]
    if: always()
    steps:
      - name: Require all jobs to succeed
        run: |
          echo "tests=${{ needs.tests.result }} web=${{ needs.web.result }} docker-build=${{ needs.docker-build.result }} package=${{ needs.package.result }} service-smoke=${{ needs.service-smoke.result }} installer-smoke=${{ needs.installer-smoke.result }}"
          [ "${{ needs.tests.result }}" = "success" ] && [ "${{ needs.web.result }}" = "success" ] && [ "${{ needs.docker-build.result }}" = "success" ] && [ "${{ needs.package.result }}" = "success" ] && [ "${{ needs.service-smoke.result }}" = "success" ] && [ "${{ needs.installer-smoke.result }}" = "success" ]

  # La web (M18): tipos, pruebas y build con el lockfile de pnpm.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # La instalación nativa (M14c): el wheel lleva Alembic y sus migraciones, y el programa
  # instalado funciona desde cualquier directorio, sin el checkout.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      # La web compilada va dentro del wheel (M18), como en la release.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # El venv limpio de abajo instala el wheel sin lock, como un usuario de pip.
      - name: Build the wheel and check it carries Alembic and the web
        run: |
          sh scripts/build-web.sh
          uv build --wheel -o dist
          unzip -l dist/*.whl > contents.txt
          for f in "fogar_gateway/web/index.html" "fogar_gateway/web/assets/index-.*\.js" "fogar_gateway/alembic.ini" "fogar_gateway/migrations/env.py" \
                   "fogar_gateway/migrations/script.py.mako" "fogar_gateway/migrations/versions/[0-9a-f]\{12\}_.*\.py"; do
            grep -q "$f" contents.txt || { echo "Falta $f en el wheel"; exit 1; }
          done

      - name: Clean venv, run from /tmp - no DB means no start, init then serve
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          export PATH=/tmp/venv/bin:$PATH
          cd /tmp
          empty=$(mktemp -d)
          rc=0; FOGAR_GATEWAY_HOME=$empty timeout 60 fogar-gw serve || rc=$?
          echo "serve sin BD: rc=$rc"
          [ "$rc" = 3 ]
          [ ! -e "$empty/data" ]  # ni BD, ni data/, ni candado
          base=$(mktemp -d)/gw
          FOGAR_GATEWAY_HOME=$base fogar-gw init
          FOGAR_GATEWAY_HOME=$base fogar-gw serve & pid=$!
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8004/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8004/healthz
          # El panel sale del paquete instalado, no del checkout (estamos en /tmp).
          curl -fsI http://127.0.0.1:8004/ | grep -qi '^content-security-policy:'
          kill $pid
          python -c "import sqlite3, sys; print(sqlite3.connect(sys.argv[1]).execute('SELECT version_num FROM alembic_version').fetchone()[0])" "$base/data/gateway.db"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: fogar-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke - starts as non-root and HEALTHCHECK turns healthy
        run: |
          docker run -d --name gw -e ADMIN_TOKEN=ci -e OPENCLAW_TOKEN=ci fogar-gateway:ci
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' gw)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          echo "health=$status"
          [ "$status" = "healthy" ] || { docker logs gw; exit 1; }
          uid=$(docker exec gw id -u)
          echo "uid=$uid"
          [ "$uid" != "0" ]
          # La imagen lleva el panel compilado en su etapa de Node (M18).
          docker exec gw python -c "from fogar_gateway.api.web_routes import web_available; assert web_available()"
          docker rm -f gw

      - name: Smoke - writes gateway.db to a bind mount owned by an arbitrary host UID
        run: |
          mkdir data
          docker run -d --name gw2 --user "$(id -u):$(id -g)" -v "$PWD/data:/app/data" \
            -e ADMIN_TOKEN=ci -e OPENCLAW_TOKEN=ci fogar-gateway:ci
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' gw2)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          echo "health=$status"
          [ "$status" = "healthy" ] || { docker logs gw2; exit 1; }
          ls -l data/gateway.db
          docker rm -f gw2

  # M14d: la instalación nativa como servicio de usuario de systemd, de punta a punta en el
  # runner de Ubuntu: init, install, healthz, reinicio de la sesión de usuario (el «reboot»),
  # logs, config set y uninstall; después «Docker → nativo» (migrate) y «Actualizar» sobre una
  # base aparte. Todas las esperas tienen tiempo límite.
  service-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # journalctl sin TTY ya no pagina; esto lo garantiza para `fogar-gw logs` (execvp).
      SYSTEMD_PAGER: ""
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      # Como la instalación oficial: no editable y fuera del checkout (pick_exe rechaza lo contrario).
      - name: Instalar fogar-gw como uv tool
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o /tmp/c.txt
          uv tool install . -c /tmp/c.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          which fogar-gw
          [ "$(which fogar-gw)" = "$HOME/.local/bin/fogar-gw" ]
          fogar-gw version || true

      - name: Preparar systemd de usuario (linger y bus)
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          # Funciones compartidas por los pasos siguientes (cada paso es un shell nuevo).
          cat > "$RUNNER_TEMP/h.sh" <<'EOF'
          wait_bus() {  # hasta 60 s: bus de usuario y systemd en running o degraded
            for i in $(seq 1 60); do
              state=$(systemctl --user is-system-running 2>/dev/null || true)
              if [ -S "$XDG_RUNTIME_DIR/bus" ] && { [ "$state" = running ] || [ "$state" = degraded ]; }; then
                echo "systemd de usuario: $state"; return 0
              fi
              sleep 1
            done
            echo "systemd de usuario no está listo (state=$state)"; return 1
          }
          wait_health() {  # hasta $1 s (60 por defecto)
            for i in $(seq 1 "${1:-60}"); do
              curl -fs --max-time 2 http://127.0.0.1:8004/healthz >/dev/null && return 0
              sleep 1
            done
            echo "/healthz no responde"; return 1
          }
          EOF
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          . "$RUNNER_TEMP/h.sh"
          wait_bus

      # init no necesita tokens: crea config.env con un ADMIN_TOKEN aleatorio y la BD.
      - name: fogar-gw init
        run: |
          fogar-gw init
          ls -l ~/.fogar-gateway ~/.fogar-gateway/data

      - name: fogar-gw install y healthz
        run: |
          . "$RUNNER_TEMP/h.sh"
          fogar-gw --yes install
          curl -fs --max-time 2 http://127.0.0.1:8004/healthz; echo
          [ "$(systemctl --user is-enabled fogar-gateway.service)" = enabled ]

      # Reinicia la sesión de usuario: para el servicio y lo vuelve a arrancar por default.target + linger.
      # Límite: no es un reboot real del kernel; lo más cercano posible en un runner.
      - name: Reboot simulado (user@UID.service)
        run: |
          . "$RUNNER_TEMP/h.sh"
          [ "$(loginctl show-user "$USER" -p Linger --value)" = yes ]
          old_inv=$(systemctl --user show -p InvocationID --value fogar-gateway.service)
          old_pid=$(systemctl --user show -p MainPID --value fogar-gateway.service)
          echo "antes: InvocationID=$old_inv MainPID=$old_pid"
          [ -n "$old_inv" ]
          [ "$old_pid" -gt 0 ]
          sudo systemctl restart "user@$(id -u).service"
          wait_bus
          wait_health 60
          new_inv=$(systemctl --user show -p InvocationID --value fogar-gateway.service)
          echo "después: InvocationID=$new_inv"
          [ -n "$new_inv" ]
          [ "$new_inv" != "$old_inv" ]
          if kill -0 "$old_pid" 2>/dev/null; then echo "el PID viejo $old_pid sigue vivo"; exit 1; fi
          [ "$(systemctl --user is-active fogar-gateway.service)" = active ]

      - name: fogar-gw logs
        run: |
          fogar-gw logs -n 20 --level WARNING  # puede no imprimir nada
          fogar-gw logs -n 5 > "$RUNNER_TEMP/logs.txt"
          cat "$RUNNER_TEMP/logs.txt"
          [ -s "$RUNNER_TEMP/logs.txt" ]

      - name: config set LOG_FORMAT json (reinicia el servicio)
        run: |
          . "$RUNNER_TEMP/h.sh"
          old_inv=$(systemctl --user show -p InvocationID --value fogar-gateway.service)
          fogar-gw --yes config set LOG_FORMAT json
          wait_health 60
          new_inv=$(systemctl --user show -p InvocationID --value fogar-gateway.service)
          [ -n "$old_inv" ]
          [ -n "$new_inv" ]
          [ "$new_inv" != "$old_inv" ]  # hubo restart
          fogar-gw logs -n 20 > "$RUNNER_TEMP/logs.txt"
          cat "$RUNNER_TEMP/logs.txt"
          python3 -c "
          import json, sys
          for line in open(sys.argv[1]):
              try:
                  if isinstance(json.loads(line), dict):
                      sys.exit(0)
              except ValueError:
                  pass
          sys.exit('ninguna línea de log es JSON')
          " "$RUNNER_TEMP/logs.txt"

      - name: fogar-gw uninstall (los datos se quedan)
        run: |
          fogar-gw --yes uninstall
          [ ! -e ~/.config/systemd/user/fogar-gateway.service ]
          [ -f ~/.fogar-gateway/config.env ]
          [ -f ~/.fogar-gateway/data/gateway.db ]
          if curl -fs --max-time 3 http://127.0.0.1:8004/healthz; then echo "el servicio sigue respondiendo"; exit 1; fi

      # Docker falso: el directorio que dejaría compose (.env + data/gateway.db). La BD sale de
      # `init` en otra base; el cliente se crea con un gateway real sobre esa base, antes de
      # instalar nada nativo (serve usa el 8004 fijo y el servicio nativo ya está desinstalado).
      - name: Docker falso con un cliente (BD en el head del paquete)
        run: |
          . "$RUNNER_TEMP/h.sh"
          D="$RUNNER_TEMP/docker-fake"
          echo "DOCKER_DIR=$D" >> "$GITHUB_ENV"
          echo "NATIVE_HOME=$RUNNER_TEMP/native" >> "$GITHUB_ENV"
          fogar-gw --home "$D" init
          fogar-gw --home "$D" serve > "$RUNNER_TEMP/docker-serve.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          wait_health 60
          fogar-gw --home "$D" --json clients add --name smoke-docker > /dev/null  # sin mostrar la clave
          fogar-gw --home "$D" --json clients list > "$RUNNER_TEMP/src-clients.json"
          grep -q smoke-docker "$RUNNER_TEMP/src-clients.json"
          kill "$pid"
          wait "$pid" || true  # SIGTERM: salida 0 o 143
          if curl -fs --max-time 2 http://127.0.0.1:8004/healthz; then echo "el gateway de origen sigue vivo"; exit 1; fi
          # .env a mano, como el de compose: comentario, export, DATABASE_URL relativa y UID/GID.
          token=$(sed -n 's/^ADMIN_TOKEN=//p' "$D/config.env")
          [ -n "$token" ]
          {
            echo "# .env de compose (falso)"
            echo "ADMIN_TOKEN=$token"
            echo "GATEWAY_UID=$(id -u)"
            echo "GATEWAY_GID=$(id -g)"
            echo "DATABASE_URL=sqlite:///data/gateway.db"
            echo "export TRUST_LOOPBACK=true"
          } > "$D/.env"
          rm "$D/config.env"
          ls -l "$D" "$D/data"
          sha256sum "$D/.env" "$D/data/gateway.db" > "$RUNNER_TEMP/src.sha"

      # El candado lo toma un `flock -x` (el contenedor en marcha): migrate debe negarse y no
      # dejar nada en la base nativa.
      - name: migrate se niega con el candado de Docker tomado
        run: |
          lock="$DOCKER_DIR/data/gateway.lock"
          [ -e "$lock" ]
          flock --no-fork -x "$lock" sleep 300 &
          holder=$!
          trap 'kill "$holder" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do  # espera a que el candado esté tomado de verdad
            if flock -n -s "$lock" true; then sleep 0.2; else break; fi
          done
          if flock -n -s "$lock" true; then echo "el candado no se ha tomado"; exit 1; fi
          rc=0
          fogar-gw --home "$NATIVE_HOME" migrate --from-docker "$DOCKER_DIR" > "$RUNNER_TEMP/mig.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/mig.txt"
          [ "$rc" -ne 0 ]
          grep -q "sigue en marcha" "$RUNNER_TEMP/mig.txt"  # falla por el candado y no por otra cosa
          [ ! -e "$NATIVE_HOME/config.env" ]
          [ ! -e "$NATIVE_HOME/data/gateway.db" ]
          kill "$holder"
          wait "$holder" || true

      - name: fogar-gw migrate --from-docker
        run: |
          fogar-gw --home "$NATIVE_HOME" migrate --from-docker "$DOCKER_DIR"
          ls -l "$NATIVE_HOME" "$NATIVE_HOME/data"
          [ "$(stat -c %a "$NATIVE_HOME/config.env")" = 600 ]
          [ "$(stat -c %a "$NATIVE_HOME/data/gateway.db")" = 600 ]
          if grep -Eiq '^[[:space:]]*(export[[:space:]]+)?(DATABASE_URL|GATEWAY_UID|GATEWAY_GID)[[:space:]]*=' "$NATIVE_HOME/config.env"; then
            echo "config.env conserva variables de compose"; exit 1
          fi
          grep -qx 'LOG_FORMAT=json' "$NATIVE_HOME/config.env"
          grep -q '^ADMIN_TOKEN=' "$NATIVE_HOME/config.env"
          grep -q '^# \.env de compose' "$NATIVE_HOME/config.env"  # el resto del fichero, tal cual
          grep -q '^export TRUST_LOOPBACK=true' "$NATIVE_HOME/config.env"
          sha256sum -c "$RUNNER_TEMP/src.sha"  # el origen, intacto

      - name: install nativo tras migrate y el cliente sigue
        run: |
          . "$RUNNER_TEMP/h.sh"
          fogar-gw --home "$NATIVE_HOME" --yes install
          wait_health 60
          curl -fs --max-time 2 http://127.0.0.1:8004/healthz; echo
          [ "$(systemctl --user is-active fogar-gateway.service)" = active ]
          # El token sale del config.env migrado: si no se hubiera copiado, /admin daría 401.
          fogar-gw --home "$NATIVE_HOME" --json clients list > "$RUNNER_TEMP/clients.json"
          python3 -c "
          import json, sys
          rows = json.load(open(sys.argv[1]))
          sys.exit(0 if any(r['name'] == 'smoke-docker' for r in rows) else 'el cliente migrado no está')
          " "$RUNNER_TEMP/clients.json"

      # README «Actualizar»: reinstalar el tool sobre el anterior (misma rama: se prueba el
      # procedimiento) y reiniciar. Las migraciones se aplican solas al arrancar.
      - name: Actualizar (uv tool install --reinstall y restart)
        run: |
          . "$RUNNER_TEMP/h.sh"
          old_inv=$(systemctl --user show -p InvocationID --value fogar-gateway.service)
          [ -n "$old_inv" ]
          uv tool install --reinstall . -c /tmp/c.txt
          [ "$(which fogar-gw)" = "$HOME/.local/bin/fogar-gw" ]
          fogar-gw --home "$NATIVE_HOME" --yes restart
          wait_health 60
          new_inv=$(systemctl --user show -p InvocationID --value fogar-gateway.service)
          [ -n "$new_inv" ]
          [ "$new_inv" != "$old_inv" ]  # hubo restart
          [ "$(systemctl --user is-active fogar-gateway.service)" = active ]
          fogar-gw --home "$NATIVE_HOME" --json clients list > "$RUNNER_TEMP/clients.json"
          grep -q smoke-docker "$RUNNER_TEMP/clients.json"  # los datos sobreviven a la actualización

      - name: uninstall final (los datos migrados se quedan)
        run: |
          fogar-gw --home "$NATIVE_HOME" --yes uninstall
          [ ! -e ~/.config/systemd/user/fogar-gateway.service ]
          [ -f "$NATIVE_HOME/config.env" ]
          [ -f "$NATIVE_HOME/data/gateway.db" ]
          if curl -fs --max-time 3 http://127.0.0.1:8004/healthz; then echo "el servicio sigue respondiendo"; exit 1; fi

      - name: Diagnóstico del servicio
        if: failure()
        run: |
          journalctl --user -u fogar-gateway.service -n 200 --no-pager || true
          systemctl --user status fogar-gateway.service --no-pager || true
          loginctl show-user "$USER" || true
          systemctl --user show -p InvocationID,MainPID,ActiveEnterTimestamp fogar-gateway.service || true

  # install.sh de punta a punta en el runner: lo que hace `curl … | sh`, con FOGAR_SOURCE apuntando
  # al checkout (sin GitHub de por medio). OpenClaw y TTS falsos que exigen token, en segundo plano
  # durante todo el job. Todas las esperas tienen tiempo límite.
  installer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Ni FAKE_* ni nada de aquí es un ajuste del gateway: no se cuelan en su configuración.
      FAKE_OPENCLAW_TOKEN: ci-openclaw-token
      FAKE_TTS_TOKEN: ci-tts-token
      # La última línea de install.sh sin asistente, tal cual (no la de una versión sin onboard).
      INSTALLED_MSG: "Instalado. Configúralo con `fogar-gw onboard` o, si vienes de Docker, `fogar-gw migrate --from-docker DIR` y `fogar-gw install`."
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: shellcheck install.sh
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck install.sh

      # El prepareCmd compila la web y construye el wheel de la release (M18).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # El prepareCmd de .releaserc.json tal cual (con su escapado JSON), sobre una copia.
      - name: test_release_stamp
        run: |
          cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/rel"
          python3 - "$RUNNER_TEMP/rel" <<'EOF'
          import json, subprocess, sys
          plugins = json.load(open(".releaserc.json"))["plugins"]
          cmd = next(p[1]["prepareCmd"] for p in plugins if p[0] == "@semantic-release/exec")
          subprocess.run(["sh", "-c", cmd.replace("${nextRelease.version}", "1.2.3")],
                         cwd=sys.argv[1], check=True)
          EOF
          sh -n "$RUNNER_TEMP/rel/install.sh"
          grep -x 'FOGAR_RELEASE=1.2.3' "$RUNNER_TEMP/rel/install.sh"
          [ "$(grep -c '^FOGAR_RELEASE=' "$RUNNER_TEMP/rel/install.sh")" = 1 ]
          grep -x 'FOGAR_RELEASE=' install.sh  # el del repo sigue sin sellar
          # El asset que instala install.sh: el wheel con su versión y la web dentro.
          unzip -l "$RUNNER_TEMP/rel/dist/fogar_gateway-1.2.3-py3-none-any.whl" | grep -q 'fogar_gateway/web/index.html'

      - name: Preparar systemd de usuario (linger y bus)
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          # wait_bus, copiada de service-smoke porque los jobs no comparten ficheros, y wait_ready.
          cat > "$RUNNER_TEMP/h.sh" <<'EOF'
          wait_bus() {  # hasta 60 s: bus de usuario y systemd en running o degraded
            for i in $(seq 1 60); do
              state=$(systemctl --user is-system-running 2>/dev/null || true)
              if [ -S "$XDG_RUNTIME_DIR/bus" ] && { [ "$state" = running ] || [ "$state" = degraded ]; }; then
                echo "systemd de usuario: $state"; return 0
              fi
              sleep 1
            done
            echo "systemd de usuario no está listo (state=$state)"; return 1
          }
          wait_ready() {  # hasta $1 s: /ready «ok» con OpenClaw y TTS ok (el STT off no lo degrada)
            for i in $(seq 1 "${1:-60}"); do
              body=$(curl -fs --max-time 10 http://127.0.0.1:8004/ready || true)
              if [ -n "$body" ] && printf '%s' "$body" | python3 -c "
          import json, sys
          r = json.load(sys.stdin)
          s = r['services']
          sys.exit(r['status'] != 'ok' or s['orchestrator'] != 'ok' or s['tts'] != 'ok')"; then
                echo "$body"; return 0
              fi
              sleep 1
            done
            echo "/ready sin status, OpenClaw y TTS ok: $body"; return 1
          }
          EOF
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          . "$RUNNER_TEMP/h.sh"
          wait_bus

      # Siguen vivos en los pasos siguientes (el runner los mata al acabar el job). El puerto
      # del TTS lo elige el sistema; el fichero se escribe cuando los dos ya escuchan.
      - name: OpenClaw (127.0.0.1:18789) y TTS falsos con token, en segundo plano
        run: |
          uv sync --locked
          nohup uv run --no-sync python -u -c "
          import asyncio, os, sys
          from pathlib import Path
          from tests.fakes.fogar_upstreams import FakeTts
          from tests.fakes.openclaw import FakeOpenClawServer

          async def main():
              tts = FakeTts(token=os.environ['FAKE_TTS_TOKEN'])
              await tts.start()
              async with FakeOpenClawServer(token=os.environ['FAKE_OPENCLAW_TOKEN'], port=18789):
                  Path(sys.argv[1]).write_text(str(tts.port))
                  print('OpenClaw en 18789, TTS en', tts.port)
                  await asyncio.Event().wait()

          asyncio.run(main())
          " "$RUNNER_TEMP/tts.port" > "$RUNNER_TEMP/fakes.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fakes.pid"
          for i in $(seq 1 30); do [ -s "$RUNNER_TEMP/tts.port" ] && break; sleep 1; done
          if [ ! -s "$RUNNER_TEMP/tts.port" ]; then
            echo "los fakes no arrancan (PID $(cat "$RUNNER_TEMP/fakes.pid"))"; cat "$RUNNER_TEMP/fakes.log"; exit 1
          fi
          curl -fs --max-time 2 http://127.0.0.1:18789/healthz; echo
          curl -fs --max-time 2 "http://127.0.0.1:$(cat "$RUNNER_TEMP/tts.port")/ready"
          cat "$RUNNER_TEMP/fakes.log"

      # Bajo un pty (script de util-linux): con terminal, solo --no-onboard impide el asistente.
      - name: install.sh --no-onboard con terminal (fogar-gw instalado; ni unidad ni base)
        env:
          LANG: es_ES.UTF-8  # INSTALLED_MSG está en español; sin esto el instalador habla inglés (#330)
        run: |
          command -v script >/dev/null || { echo "falta script (util-linux)"; exit 1; }
          # Control positivo: si el pty no diera terminal, el paso pasaría sin probar el flag.
          timeout 30 script -qec 'test -t 1 && : </dev/tty' /dev/null </dev/null || { echo "script no da un TTY"; exit 1; }
          rc=0
          timeout 180 script -qec "FOGAR_SOURCE=$GITHUB_WORKSPACE sh install.sh --no-onboard" /dev/null \
            < /dev/null > "$RUNNER_TEMP/pty.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/pty.txt"
          [ "$rc" = 0 ]
          grep -qF "$INSTALLED_MSG" "$RUNNER_TEMP/pty.txt"  # sin -x: el pty acaba las líneas en \r\n
          [ -x "$HOME/.local/bin/fogar-gw" ]
          [ ! -e "$HOME/.config/systemd/user/fogar-gateway.service" ]
          [ ! -e "$HOME/.fogar-gateway" ]  # lo que necesita `migrate --from-docker` después
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: test_install_without_tty_skips_onboard
        env:
          LANG: es_ES.UTF-8
        run: |
          rc=0
          FOGAR_SOURCE="$GITHUB_WORKSPACE" sh install.sh < /dev/null > "$RUNNER_TEMP/notty.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/notty.txt"
          [ "$rc" = 0 ]
          grep -qxF "$INSTALLED_MSG" "$RUNNER_TEMP/notty.txt"
          [ ! -e "$HOME/.config/systemd/user/fogar-gateway.service" ]
          [ ! -e "$HOME/.fogar-gateway" ]

      - name: fogar-gw onboard --answers (OpenClaw y TTS falsos, STT off, cliente smoke)
        run: |
          . "$RUNNER_TEMP/h.sh"
          port=$(cat "$RUNNER_TEMP/tts.port")
          umask 077
          cat > "$RUNNER_TEMP/answers.json" <<EOF
          {"openclaw_host": "127.0.0.1", "openclaw_port": 18789, "openclaw_token": "$FAKE_OPENCLAW_TOKEN",
           "stt": {"provider": "off"},
           "tts": {"provider": "fogar", "url": "127.0.0.1:$port", "token": "$FAKE_TTS_TOKEN"},
           "first_client": {"name": "smoke", "type": "web"}}
          EOF
          [ "$(stat -c %a "$RUNNER_TEMP/answers.json")" = 600 ]
          # La salida lleva la clave del cliente: solo se enseña si falla.
          if ! fogar-gw onboard --answers "$RUNNER_TEMP/answers.json" > "$RUNNER_TEMP/onboard.txt" 2>&1; then
            cat "$RUNNER_TEMP/onboard.txt"; exit 1
          fi
          [ "$(systemctl --user is-active fogar-gateway.service)" = active ]
          # El final lleva al dashboard: URL, dónde está el token y cómo verlo, nunca su valor.
          admin=$(sed -n 's/^ADMIN_TOKEN=//p' ~/.fogar-gateway/config.env)
          [ -n "$admin" ]
          grep -q 'Tu dashboard: http://.*:8004/' "$RUNNER_TEMP/onboard.txt"
          grep -qF "$HOME/.fogar-gateway/config.env (ADMIN_TOKEN)" "$RUNNER_TEMP/onboard.txt"
          ! grep -qF "$admin" "$RUNNER_TEMP/onboard.txt"
          # `fogar-gw token` sin terminal se niega y no escribe el token.
          rc=0
          fogar-gw token > "$RUNNER_TEMP/token.txt" 2>&1 || rc=$?
          [ "$rc" = 1 ]
          ! grep -qF "$admin" "$RUNNER_TEMP/token.txt"
          curl -fs --max-time 2 http://127.0.0.1:8004/healthz; echo
          wait_ready 60
          # «doctor sale limpio»: ningún fallo, y el STT off como información, no como caída.
          rc=0
          fogar-gw --json doctor > "$RUNNER_TEMP/doctor.json" || rc=$?
          cat "$RUNNER_TEMP/doctor.json"
          python3 - "$RUNNER_TEMP/doctor.json" <<'EOF'
          import json, sys
          checks = json.load(open(sys.argv[1]))
          fails = [c["check"] for c in checks if c["level"] == "fail"]
          stt = [c for c in checks if c["check"] == "STT"]
          if fails:
              sys.exit(f"doctor con fallos: {fails}")
          if len(stt) != 1 or stt[0]["level"] != "info" or "voz desactivada" not in stt[0]["detail"]:
              sys.exit(f"el STT off no sale como información: {stt}")
          EOF
          [ "$rc" = 0 ]
          fogar-gw --json clients list > "$RUNNER_TEMP/clients.json"
          python3 -c "
          import json, sys
          rows = json.load(open(sys.argv[1]))
          sys.exit(0 if any(r['name'] == 'smoke' for r in rows) else 'falta el cliente smoke')
          " "$RUNNER_TEMP/clients.json"
          [ "$(grep -c '^TTS_TOKEN=' ~/.fogar-gateway/config.env)" = 1 ]
          cp ~/.fogar-gateway/config.env "$RUNNER_TEMP/config.env.before"

      - name: reejecutar install.sh actualiza (reinicia, no pregunta, config.env igual)
        run: |
          . "$RUNNER_TEMP/h.sh"
          old_inv=$(systemctl --user show -p InvocationID --value fogar-gateway.service)
          [ -n "$old_inv" ]
          rc=0
          FOGAR_SOURCE="$GITHUB_WORKSPACE" sh install.sh < /dev/null > "$RUNNER_TEMP/rerun.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/rerun.txt"
          [ "$rc" = 0 ]  # no ha preguntado: sin TTY, una pregunta sale con 1 (o con 2, restart sin --yes)
          new_inv=$(systemctl --user show -p InvocationID --value fogar-gateway.service)
          echo "InvocationID: $old_inv -> $new_inv"
          [ -n "$new_inv" ]
          [ "$new_inv" != "$old_inv" ]  # hubo restart
          [ "$(systemctl --user is-active fogar-gateway.service)" = active ]
          cmp "$RUNNER_TEMP/config.env.before" ~/.fogar-gateway/config.env
          wait_ready 60
          fogar-gw --json clients list > "$RUNNER_TEMP/clients.json"
          grep -q '"smoke"' "$RUNNER_TEMP/clients.json"

      # #317: el alta por código de punta a punta, y ni el código ni la clave en el journal.
      - name: emparejar un cliente (fogar-gw pair, POST /pair y la clave abre sesión)
        run: |
          curl -fs --max-time 5 http://127.0.0.1:8004/.well-known/fogar-gateway \
            | python3 -c "import json, sys; sys.exit(json.load(sys.stdin)['service'] != 'fogar-gateway')"
          fogar-gw --json pair --no-wait --type screen --name smoke-tele > "$RUNNER_TEMP/pair.json"
          code=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1]))['code'])" "$RUNNER_TEMP/pair.json")
          wrong=$(python3 -c "import sys; print(f'{(int(sys.argv[1]) + 1) % 10**6:06d}')" "$code")
          post() { curl -s --max-time 5 -o "$RUNNER_TEMP/paired.json" -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d "{\"code\": \"$1\"}" http://127.0.0.1:8004/pair; }
          [ "$(post "$wrong")" = 400 ]
          [ "$(post "$code")" = 201 ]
          PAIRED_KEY=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1]))['client_key'])" "$RUNNER_TEMP/paired.json")
          export PAIRED_KEY
          [ "$(post "$code")" = 400 ]  # de un solo uso (sobrescribe paired.json: la clave ya está leída)
          uv run --no-sync python - <<'EOF'
          import asyncio, json, os
          import websockets

          async def main():
              async with websockets.connect("ws://127.0.0.1:8004/ws/stream") as ws:
                  await ws.send(json.dumps({"client_key": os.environ["PAIRED_KEY"],
                                            "input_mode": "text", "output_mode": ["text"]}))
                  for _ in range(5):
                      msg = json.loads(await asyncio.wait_for(ws.recv(), timeout=10))
                      if msg.get("type") == "ready":
                          print("sesión abierta con la clave emparejada")
                          return
                  raise SystemExit("sin ready con la clave emparejada")

          asyncio.run(main())
          EOF
          journalctl --user -u fogar-gateway.service --no-pager > "$RUNNER_TEMP/journal.txt"
          grep -q "Emparejamiento: cliente" "$RUNNER_TEMP/journal.txt"
          # `|| exit 1`: bash -e no corta en un `!` negado.
          ! grep -qF "$PAIRED_KEY" "$RUNNER_TEMP/journal.txt" || { echo "la clave está en el journal"; exit 1; }
          ! grep -qwF "$code" "$RUNNER_TEMP/journal.txt" || { echo "el código está en el journal"; exit 1; }
          ! grep -qwF "$wrong" "$RUNNER_TEMP/journal.txt" || { echo "el código erróneo está en el journal"; exit 1; }

      - name: Diagnóstico del instalador
        if: failure()
        run: |
          echo "fakes (PID $(cat "$RUNNER_TEMP/fakes.pid" 2>/dev/null)):"
          ps -p "$(cat "$RUNNER_TEMP/fakes.pid" 2>/dev/null || echo 0)" -o pid,stat,cmd || echo "los fakes no siguen vivos"
          cat "$RUNNER_TEMP/fakes.log" || true
          journalctl --user -u fogar-gateway.service -n 200 --no-pager || true
          systemctl --user status fogar-gateway.service --no-pager || true
          loginctl show-user "$USER" || true
          ls -la ~/.local/bin ~/.config/systemd/user ~/.fogar-gateway || true
