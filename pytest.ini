[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -m "not e2e_real and not live"
timeout = 60
timeout_method = thread
markers =
    integration: marks tests as integration tests
    e2e_real: hits the real production OpenClaw/gateway — never runs by default, requires -m e2e_real
    live: smoke contra un proveedor real (JGW_LIVE=1); excluido por defecto, se activa con -m live
