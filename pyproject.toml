[project]
name = "jota-gateway"
version = "1.15.1"
description = "BFF gateway for jota voice/text clients"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.49.0",
    "websockets>=11.0.3",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "cachetools>=7.1.4",
    "sqlmodel>=0.0.39",
    "alembic>=1.18.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<9.2.0",
    "pytest-asyncio>=1.3.0,<1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.20",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]



[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "BLE001",
    "S110",
    "TRY002",
    "TRY203",
    "TRY004",
    "ASYNC251",
    "B008",
    "B017",
    "RUF059",
    "RUF013",
    "SIM102",
    "SIM117",
    "SIM105",
    "B904",
    "B905",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "SIM105"]
"src/**" = ["E501"]

