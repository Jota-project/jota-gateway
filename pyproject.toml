[project]
name = "jota-gateway"
# Fijo a propósito: la versión real es el tag de git que crea semantic-release (CHANGELOG.md).
version = "0.0.0"
description = "BFF gateway for jota voice/text clients"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.52.1",
    "websockets>=16.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.1",
    "sqlmodel>=0.0.39",
    "alembic>=1.18.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<9.2.0",
    "pytest-asyncio>=1.4.0,<1.5.0",
    "respx>=0.23.1",
    "ruff>=0.15.21",
    "mypy>=1.20",
    "packaging>=23",
    "pytest-timeout>=2.4",
    "pytest-cov>=7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]



[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# BLE001/S110/S112/B904/RUF006/ASYNC/TID251: política de errores y cancelación (#221,
# vault «JGW Decisión - Política de errores y cancelación»). TRY400 queda fuera a
# propósito: logger.exception volcaría el texto de la excepción.
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF",
    "BLE001", "S110", "S112", "ASYNC", "TID251",
]
ignore = [
    "TRY002",
    "TRY203",
    "TRY004",
    "ASYNC251",
    "B008",
    "B017",
    "RUF059",
    "RUF013",
    "SIM102",
    "SIM117",
    "SIM105",
    "B905",
    "RUF002",
    # API propia con parámetro `timeout` (outbound, registry, openclaw client).
    "ASYNC109",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"contextlib.suppress".msg = "Es un `except: pass` invisible; usa try/except con log (#221)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "SIM105", "BLE001", "S110", "S112", "B904", "ASYNC", "TID251"]
"src/**" = ["E501"]
# Pendientes de revisar con la política de #221: cada PR de la serie quita los suyos.
"src/services/bridge.py" = ["BLE001", "S110", "S112", "B904", "ASYNC", "RUF006"]
"src/main.py" = ["BLE001", "S110", "S112", "B904", "ASYNC", "RUF006"]
"src/api/**" = ["BLE001", "S110", "S112", "B904", "ASYNC", "RUF006"]
"src/core/transport.py" = ["BLE001", "S110", "S112", "B904", "ASYNC", "RUF006"]
"src/services/{outbound,pipeline_tracker}.py" = ["BLE001", "S110", "S112", "B904", "ASYNC", "RUF006"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
